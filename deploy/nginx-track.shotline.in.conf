# /etc/nginx/sites-available/track.shotline.in  (symlink into sites-enabled)
# certbot --nginx -d track.shotline.in adds the 443 server block and redirect.
server {
    listen 80;
    listen [::]:80;
    server_name track.shotline.in;

    # Keep recipients' IPs and user agents out of nginx logs; the app records what it needs.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
    }
}
